name: admin_app
description: "Helmand University Digital Library - Admin App (separate, managers only)"
publish_to: "none"
version: 1.0.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  file_picker: ^12.0.0
  # Supabase Auth + Database + Storage for the Admin App.
  # Keys are NEVER in this code: pass them with
  # --dart-define SUPABASE_URL / SUPABASE_ANON_KEY
  # (in GitHub Actions they come from repository Secrets).
  supabase_flutter: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
