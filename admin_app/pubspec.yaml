name: admin_app
description: "Helmand University Digital Library - Admin App (separate, managers only)"
publish_to: "none"
version: 1.0.0+6

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  file_picker: ^12.0.0
  # For the catalogue seed (Build 38): network errors from Supabase
  # surface as ClientException from this package.
  http: ^1.2.0
  # Supabase Auth + Database + Storage for the Admin App.
  # Keys are NEVER in this code: pass them with
  # --dart-define SUPABASE_URL / SUPABASE_ANON_KEY
  # (in GitHub Actions they come from repository Secrets).
  supabase_flutter: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # Bundled catalogue for the one-time seed (Build 38). Same rows as
    # the SQL seeds in hidden_files/link-admin-student/, generated by
    # generate_seed_json.py from the same verified sources.
    - assets/seed/subjects.json
    - assets/seed/books.json
    - assets/seed/book_subjects.json
    - assets/seed/book_placements.json
    - assets/seed/reading_books.json
    - assets/seed/seed_meta.json
