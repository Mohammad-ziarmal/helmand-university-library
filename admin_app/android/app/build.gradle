plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) { flutterVersionCode = "1" }

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) { flutterVersionName = "1.0" }

android {
    namespace = "com.helmandlibrary.admin"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // Release lint crashes on a lint-tool bug (JavaDoc parsing) with the
    // current toolchain, so skip the release lint check. It does not
    // affect the built APK.
    lint {
        checkReleaseBuilds = false
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        // The admin app. This id must stay stable: changing it later
        // makes the phones treat it as a different app.
        applicationId = "com.helmandlibrary.admin"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    // Release signing: the keystore and its passwords come from
    // key.properties (written by CI from GitHub Secrets). They are never
    // in the code or the repo. Without key.properties, fall back to the
    // debug key so a local test build still works.
    def keystoreProperties = new Properties()
    def keystorePropertiesFile = rootProject.file("key.properties")
    if (keystorePropertiesFile.exists()) {
        keystorePropertiesFile.withReader("UTF-8") { reader -> keystoreProperties.load(reader) }
    }

    signingConfigs {
        release {
            if (keystoreProperties.getProperty("storeFile") != null) {
                storeFile = file(keystoreProperties.getProperty("storeFile"))
                storePassword = keystoreProperties.getProperty("storePassword")
                keyAlias = keystoreProperties.getProperty("keyAlias")
                keyPassword = keystoreProperties.getProperty("keyPassword")
                storeType = "PKCS12"
            }
        }
    }

    buildTypes {
        release {
            // One permanent release key for this app: every build is
            // signed with the same key, so updates install over the old
            // version instead of failing with "App not installed".
            if (keystoreProperties.getProperty("storeFile") != null) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
        }
    }
}

flutter {
    source = "../.."
}
