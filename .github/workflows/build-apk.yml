# Build APKs — Helmand University Digital Library (free, GitHub Actions)
#
# Builds the release APK for the student app and the admin app.
# Runs on every push to main, or manually from the Actions tab.
# The APKs appear under "Artifacts" when the run finishes.
#
# The student APK is ALSO published to a rolling public release
# tagged "latest", so students always download the newest version
# from one permanent link (no login needed):
#   https://github.com/Mohammad-ziarmal/helmand-university-library/releases/tag/latest
# Only the student APK is published there — never the admin APK.
# The release job uses the runner's own GITHUB_TOKEN, so no
# password or extra secret is needed for the upload.
#
# Secrets (optional at first): SUPABASE_URL and SUPABASE_ANON_KEY.
# If they are not set, the apps still build and work — the student app
# uses its bundled catalogue offline, and the admin app shows its
# setup screen. Add the secrets in:
#   Repository Settings > Secrets and variables > Actions > New secret
# Never put real keys in the code.
#
# Release signing (required): KEYSTORE_BASE64, KEYSTORE_PASSWORD,
# KEY_ALIAS, KEY_PASSWORD. One permanent release keystore signs every
# build, so updates install over the old version. Without these secrets
# the build fails instead of silently signing with a throwaway debug key.

name: Build APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.app }} APK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: student_app
            artifact: student-app-apk
          - app: admin_app
            artifact: admin-app-apk
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "9.5.0"

      - name: Create local.properties
        # settings.gradle reads flutter.sdk from android/local.properties,
        # but that file is local-only (gitignored) and never exists on the
        # runner. Write it from the Flutter install before Gradle runs.
        run: |
          FLUTTER_SDK="$(dirname "$(dirname "$(command -v flutter)")")"
          echo "flutter.sdk=$FLUTTER_SDK" > local.properties
        working-directory: ${{ matrix.app }}/android

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.5.0
        working-directory: ${{ matrix.app }}/android

      - name: Set up release signing keystore
        # The release keystore lives only in GitHub Secrets. Decode it
        # here and write key.properties for Gradle; both live only on
        # this throwaway runner and never enter the repo.
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Release signing secret KEYSTORE_BASE64 is not set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.p12
          cat > key.properties <<EOF
          storeFile=release.p12
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
        working-directory: ${{ matrix.app }}/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Get packages
        run: flutter pub get
        working-directory: ${{ matrix.app }}

      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
        working-directory: ${{ matrix.app }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  release:
    name: Publish latest release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download student APK
        uses: actions/download-artifact@v4
        with:
          name: student-app-apk
          path: apk

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv apk/app-release.apk apk/helmand-university-library.apk
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "د هلمند پوهنتون ډیجیټل کتابتون — وروستۍ نسخه" --notes "د محصلینو اپلیکیشن وروستۍ نسخه — APK مستقیم ډاونلوډ کړئ او انسټال یې کړئ. (Latest student app — download the APK and install it.)"
          gh release delete-asset latest helmand-university-library.apk -y || true
          gh release upload latest apk/helmand-university-library.apk
